version: '3'

tasks:

  # schema

  conditional-pip-install:
    internal: true
    status:
    - command -v {{.COMMAND}}
    cmds:
    - pip install {{.COMMAND}}

  check_schema:
    desc: Executes a strict check of a configuration over the JSON schema
    deps:
    - task: conditional-pip-install
      vars:
        COMMAND: check-jsonschema
    ignore_error: true
    cmds:
    - check-jsonschema --schemafile ./schemas/config.schema.yaml {{.CONFIG}}

  check_schemas:
    desc: Executes a strict check of a configurations set over the JSON schema
    vars:
      CONFIGS:
      - './eoepca-demo/config.yml'
      - './files/hub/config.yml'
    cmds:
    - for:
        var: CONFIGS
        as: CONFIG
      task: check_schema
      vars:
        CONFIG: "{{.CONFIG}}"

  # Config generation

  generate_tutorial_config:
    desc: |
      Generates tutorial-config.yml with all remote desktop profiles + the
      sample Streamlit app profile. Requires app-hub-configurator installed
      (pip install app-hub-configurator) and iga-streamlit-demo cloned
      alongside this repository.
      Usage: task generate_tutorial_config
    cmds:
    - dump-config
        --profiles-dir ../iga-streamlit-demo/profile
        --profiles sample_app_slug,remote_desktop,qgis_remote_desktop,panoply_remote_desktop,snap_remote_desktop
        --groups group-a,group-b,group-c
        --storage-class-rwo hostpath
        --output tutorial-config.yml

  # Python models

  create_models:
    desc: Generates the Pydantic models with field aliases
    deps:
    - task: conditional-pip-install
      vars:
        COMMAND: datamodel-codegen
    cmds:
    - |
      datamodel-codegen  --input ./schemas/config.schema.yaml \
                         --input-file-type jsonschema \
                         --output-model-type pydantic_v2.BaseModel \
                         --base-class pydantic.BaseModel \
                         --snake-case-field \
                         --output ./application_hub_context/models.py
