apiVersion: skaffold/v4beta9
kind: Config

# Prerequisites:
#   - Docker with buildx support (for multi-arch builds)
#   - kubectl configured to target your cluster
#   - skaffold >= 2.17
#
# Quick start:
#   Docker Desktop (Mac/Windows):  skaffold run -p hostpath
#   kind / minikube:               skaffold run -p tutorial
#
# Access the hub at http://localhost:8000 after deployment.

build:
  artifacts:
    - image: hubimage

deploy:
  helm:
    # Workaround: application-hub chart 4.0.2 generates a `standardMode` field
    # that Kubernetes 1.25+ rejects during OpenAPI validation (correct field is `defaultMode`).
    flags:
      install: ["--disable-openapi-validation"]
      upgrade: ["--disable-openapi-validation"]
    releases:
      - name: jupyterhub
        repo: https://eoepca.github.io/helm-charts-dev/
        remoteChart: application-hub
        namespace: jupyter
        version: 4.0.2
        createNamespace: true
        valuesFiles: []
        setValueTemplates:
          jupyterhub.hub.image.name: "{{.IMAGE_REPO_hubimage}}"
          jupyterhub.hub.image.tag: "{{.IMAGE_TAG_hubimage}}@{{.IMAGE_DIGEST_hubimage}}"
        setValues:
          jupyterhub.hub.image.pullSecrets: []
          jupyterhub.hub.db.pvc.storageClassName: standard
          jupyterhub.hub.extraEnv.STORAGE_CLASS: standard
          jupyterhub.proxy.secretToken: "032d5bfe141a7eab86d57587879b33c5d168617cacb339823d7f47fe2933f880"
          jupyterhub.hub.extraEnv.APP_HUB_NAMESPACE: jupyter
          jupyterhub.hub.networkPolicy.enabled: false
        setFiles:
          configYml: ./files/hub/config.yml
          jupyterConfig: ./files/hub/jupyterhub_config.py

manifests:
  rawYaml:
  - sk-k8s/cluster-role-binding.yaml
  - sk-k8s/script.yaml
  - sk-k8s/job.yaml

portForward:
- resourceType: service
  resourceName: application-hub-proxy-public
  namespace: jupyter
  port: 80
  localPort: 8000

profiles:

  # Build and deploy using the latest-dev hub image (no local build)
  - name: develop
    patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/jupyterhub.hub.image.name
        value: ghcr.io/eoepca/application-hub
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/jupyterhub.hub.image.tag
        value: latest-dev

  # Deploy using the latest stable hub image (no local build)
  - name: main
    patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/jupyterhub.hub.image.name
        value: ghcr.io/eoepca/application-hub
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/jupyterhub.hub.image.tag
        value: latest

  # Deploy with a user-provided config (copy your config.yml to custom-config.yml first)
  - name: custom
    patches:
      - op: add
        path: /deploy/helm/releases/0/setFiles/configYml
        value: custom-config.yml

  # Tutorial: deploy the hub with the sample application profile
  # Usage: skaffold run -p tutorial
  - name: tutorial
    patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/jupyterhub.hub.image.name
        value: ghcr.io/eoepca/application-hub
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/jupyterhub.hub.image.tag
        value: latest
      - op: replace
        path: /deploy/helm/releases/0/setFiles/configYml
        value: tutorial-config.yml

  # Docker Desktop on Mac/Windows (storage class = hostpath)
  # Usage: skaffold run -p hostpath
  - name: hostpath
    build:
      artifacts: []   # use pre-built hub image, no local build
    patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/jupyterhub.hub.image.name
        value: ghcr.io/eoepca/application-hub
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/jupyterhub.hub.image.tag
        value: latest
      - op: replace
        path: /deploy/helm/releases/0/setValues/jupyterhub.hub.db.pvc.storageClassName
        value: hostpath
      - op: replace
        path: /deploy/helm/releases/0/setValues/jupyterhub.hub.extraEnv.STORAGE_CLASS
        value: hostpath
      - op: replace
        path: /deploy/helm/releases/0/setFiles/configYml
        value: tutorial-config.yml

  # Build multi-platform hub image (linux/amd64 + linux/arm64)
  # Requires Docker buildx: docker buildx create --use
  # Multi-platform builds must push to a registry — local daemon is not supported.
  # Usage: skaffold build -p multi-arch --default-repo ghcr.io/<your-org>
  - name: multi-arch
    build:
      platforms:
        - linux/amd64
        - linux/arm64
